[package]
name = "teamscord"
version = "0.2.3"
description = "Rede social descentralizada para grupos, chat e calls"
authors = ["Teamscord"]
edition = "2021"

[lib]
name = "teamscord_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
futures = "0.3"
getrandom = "0.3"
keyring = "4.1"
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "gossipsub", "identify", "ping", "relay", "request-response", "json", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
