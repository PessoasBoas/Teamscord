[package]
name = "teamscord-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "noise", "yamux", "relay", "ping", "identify", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
